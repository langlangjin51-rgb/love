<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>阿圆儿 · 520快乐</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0a0f1a;
      font-family: "楷体", "KaiTi", "华文楷体", "STKaiti", "微软雅黑", sans-serif;
    }
    #info {
      position: absolute;
      bottom: 120px;
      width: 100%;
      text-align: center;
      color: #fff5e6;
      text-shadow: 0 0 20px #ff4d6d, 0 0 40px #c9184a;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: bold;
      letter-spacing: 6px;
      z-index: 20;
      pointer-events: none;
      animation: gentleGlow 2s ease-in-out infinite alternate;
    }
    @keyframes gentleGlow {
      0% { text-shadow: 0 0 25px #ff758f, 0 0 50px #ff4d6d, 0 0 70px #c9184a; }
      100% { text-shadow: 0 0 40px #ff99ac, 0 0 70px #ff6b81, 0 0 90px #e63946; }
    }
    canvas {
      display: block;
    }
    .floating-wish {
      position: absolute;
      font-family: "楷体", "KaiTi", "华文楷体", "STKaiti", "微软雅黑", sans-serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: bold;
      color: transparent;
      background: linear-gradient(135deg, #ff6b9d, #ffc0cb, #ff8fab, #ffb3c6);
      background-clip: text;
      -webkit-background-clip: text;
      text-shadow: 0 0 20px rgba(255, 107, 157, 0.6);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
    }
    .float-up {
      animation: floatUp 4s linear forwards;
    }
    .float-down {
      animation: floatDown 4s linear forwards;
    }
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(100vh) rotate(-3deg);
      }
      90% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) rotate(3deg);
      }
    }
    @keyframes floatDown {
      0% {
        opacity: 1;
        transform: translateY(-100px) rotate(3deg);
      }
      90% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(-3deg);
      }
    }
  </style>
</head>
<body>
  <div id="info">阿圆儿 520快乐</div>

  <!-- 引入 Three.js 核心库以及扩展 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- 初始化场景、相机、渲染器 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1a);
    
    // 添加一些微妙的星光背景（通过粒子系统）
    function addStarField() {
      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 800;
      const starsPositions = new Float32Array(starsCount * 3);
      for (let i = 0; i < starsCount * 3; i += 3) {
        starsPositions[i] = (Math.random() - 0.5) * 45;
        starsPositions[i+1] = (Math.random() - 0.5) * 25;
        starsPositions[i+2] = (Math.random() - 0.5) * 20 - 2;
      }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
      const starsMaterial = new THREE.PointsMaterial({ 
        color: 0xaaccff, 
        size: 0.08,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const stars = new THREE.Points(starsGeometry, starsMaterial);
      scene.add(stars);
    }
    addStarField();

    // 主相机
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 60);
    camera.position.set(4.5, 2.8, 6.5);
    camera.lookAt(0, 0.5, 0);

    // WebGL渲染器
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      alpha: false 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // CSS2渲染器用于文字（但底部文字用HTML显示更美观，这里保留CSS2D作为备用或装饰）
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none'; // 让点击穿透
    document.body.appendChild(labelRenderer.domElement);

    // --- 灯光设置 ---
    const ambientLight = new THREE.AmbientLight(0x404066);
    scene.add(ambientLight);
    
    const mainLight = new THREE.DirectionalLight(0xffccdd, 1.1);
    mainLight.position.set(2, 5, 4);
    mainLight.castShadow = true;
    mainLight.receiveShadow = true;
    mainLight.shadow.mapSize.width = 512;
    mainLight.shadow.mapSize.height = 512;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 25;
    scene.add(mainLight);
    
    const backLight = new THREE.PointLight(0x4466aa, 0.8);
    backLight.position.set(-2, 1, -3);
    scene.add(backLight);
    
    // 添加一些彩色光烘托气氛
    const pinkLight = new THREE.PointLight(0xff4d6d, 0.9);
    pinkLight.position.set(1.5, 0.8, 1.8);
    scene.add(pinkLight);
    
    const goldLight = new THREE.PointLight(0xffaa33, 0.7);
    goldLight.position.set(-1.2, -0.3, 1.5);
    scene.add(goldLight);

    // --- 辅助元素：地面反射效果（半透明平面） ---
    const groundGeometry = new THREE.CircleGeometry(4.5, 32);
    const groundMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x1a1a2e, 
      roughness: 0.7, 
      metalness: 0.3,
      transparent: true,
      opacity: 0.25,
      side: THREE.DoubleSide
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.35;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- 核心：爱心形状 (使用心形曲线拉伸成立体) ---
    const heartGroup = new THREE.Group();
    
    // 心形路径 (2D)
    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo(x, y + 0.25);
    heartShape.bezierCurveTo(x, y + 0.45, x - 0.65, y + 0.45, x - 0.65, y + 0.25);
    heartShape.bezierCurveTo(x - 0.65, y - 0.15, x - 0.35, y - 0.55, x, y - 0.8);
    heartShape.bezierCurveTo(x + 0.35, y - 0.55, x + 0.65, y - 0.15, x + 0.65, y + 0.25);
    heartShape.bezierCurveTo(x + 0.65, y + 0.45, x, y + 0.45, x, y + 0.25);
    
    // 拉伸设置：形成立体爱心
    const extrudeSettings = {
      steps: 1,
      depth: 0.28,
      bevelEnabled: true,
      bevelThickness: 0.12,
      bevelSize: 0.08,
      bevelSegments: 3
    };
    
    const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
    // 居中几何体
    heartGeometry.center();
    
    // 爱心材质：半透明粉红玻璃质感
    const heartMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xff3366,
      emissive: new THREE.Color(0x330010),
      roughness: 0.22,
      metalness: 0.1,
      transparent: true,
      opacity: 0.75,
      clearcoat: 0.4,
      clearcoatRoughness: 0.2,
      emissiveIntensity: 0.5
    });
    
    const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
    heartMesh.castShadow = true;
    heartMesh.receiveShadow = true;
    heartMesh.rotation.y = 0.2;
    heartMesh.rotation.x = 0.1;
    heartMesh.position.y = 0.15;
    heartGroup.add(heartMesh);
    
    // 爱心边缘发光线框 (增强轮廓)
    const wireframeGeometry = new THREE.EdgesGeometry(heartGeometry);
    const wireframeMaterial = new THREE.LineBasicMaterial({ 
      color: 0xff99cc, 
      transparent: true,
      opacity: 0.5
    });
    const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
    heartMesh.add(wireframe);
    
    // 爱心内部点缀一些小光点
    const dotsGeometry = new THREE.SphereGeometry(0.06, 4, 4);
    const dotsMaterial = new THREE.MeshStandardMaterial({ color: 0xffb3c6, emissive: new THREE.Color(0x440011) });
    for (let i = 0; i < 12; i++) {
      const dot = new THREE.Mesh(dotsGeometry, dotsMaterial);
      const angle = (i / 12) * Math.PI * 2;
      const radius = 0.45;
      dot.position.set(Math.cos(angle) * radius * 0.9, Math.sin(angle) * radius * 0.7 + 0.15, 0.15);
      heartMesh.add(dot);
    }
    
    scene.add(heartGroup);

    // --- 玫瑰花束 (放在爱心中央) ---
    const roseGroup = new THREE.Group();
    roseGroup.position.set(0, 0.25, 0.15);
    
    function createRose(colorHex, sizeScale = 1.0, posX = 0, posY = 0, posZ = 0) {
      const rose = new THREE.Group();
      const stemColor = 0x2d5a27;
      const leafColor = 0x3e7a3a;
      
      // 茎
      const stemGeo = new THREE.CylinderGeometry(0.04 * sizeScale, 0.06 * sizeScale, 0.55 * sizeScale, 6);
      const stemMat = new THREE.MeshStandardMaterial({ color: stemColor, roughness: 0.7 });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = -0.18 * sizeScale;
      stem.castShadow = true;
      stem.receiveShadow = true;
      rose.add(stem);
      
      // 叶子
      const leafGeo = new THREE.SphereGeometry(0.12 * sizeScale, 4, 4);
      const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.4 });
      const leaf1 = new THREE.Mesh(leafGeo, leafMat);
      leaf1.position.set(0.15 * sizeScale, -0.1 * sizeScale, 0.05 * sizeScale);
      leaf1.scale.set(0.7, 0.2, 0.3);
      leaf1.castShadow = true;
      rose.add(leaf1);
      
      const leaf2 = leaf1.clone();
      leaf2.position.set(-0.14 * sizeScale, -0.15 * sizeScale, -0.04 * sizeScale);
      leaf2.scale.set(0.7, 0.2, 0.3);
      rose.add(leaf2);
      
      // 花朵主体 (多层球体叠加模拟玫瑰)
      const petalColor = new THREE.Color(colorHex);
      const layers = [
        { scale: 0.22, y: 0.08, color: petalColor.clone().multiplyScalar(0.85) },
        { scale: 0.19, y: 0.14, color: petalColor },
        { scale: 0.15, y: 0.19, color: petalColor.clone().multiplyScalar(1.1) },
        { scale: 0.1, y: 0.23, color: petalColor.clone().multiplyScalar(1.2) }
      ];
      
      layers.forEach(layer => {
        const petalGeo = new THREE.SphereGeometry(layer.scale * sizeScale, 16, 16);
        const petalMat = new THREE.MeshStandardMaterial({ 
          color: layer.color, 
          roughness: 0.35,
          emissive: new THREE.Color(0x220011),
          emissiveIntensity: 0.2
        });
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.position.y = layer.y * sizeScale;
        petal.castShadow = true;
        petal.receiveShadow = true;
        rose.add(petal);
      });
      
      rose.position.set(posX, posY, posZ);
      return rose;
    }
    
    // 创建多朵玫瑰组成花束
    const centerRose = createRose(0xff1744, 1.0, 0, 0.05, 0);
    const roseLeft = createRose(0xff4081, 0.9, -0.18, -0.02, 0.08);
    const roseRight = createRose(0xe91e63, 0.9, 0.18, -0.02, 0.08);
    const roseBack = createRose(0xd81b60, 0.88, 0, 0.0, -0.15);
    const roseFront = createRose(0xf06292, 0.92, 0.05, -0.04, 0.18);
    const roseExtraLeft = createRose(0xff5252, 0.82, -0.26, -0.06, -0.05);
    const roseExtraRight = createRose(0xff1744, 0.82, 0.26, -0.06, -0.05);
    
    roseGroup.add(centerRose);
    roseGroup.add(roseLeft);
    roseGroup.add(roseRight);
    roseGroup.add(roseBack);
    roseGroup.add(roseFront);
    roseGroup.add(roseExtraLeft);
    roseGroup.add(roseExtraRight);
    
    // 添加一些散落的小花苞
    for (let i = 0; i < 6; i++) {
      const bud = createRose(0xff8a80, 0.45, 
        (Math.random() - 0.5) * 0.45, 
        Math.random() * 0.2 - 0.15, 
        (Math.random() - 0.5) * 0.4
      );
      roseGroup.add(bud);
    }
    
    heartGroup.add(roseGroup);

    // --- 烟花系统 (环绕爱心四周) ---
    const fireworksGroup = new THREE.Group();
    scene.add(fireworksGroup);
    
    // 烟花粒子数据存储
    const fireworksParticles = [];
    
    // 创建单个烟花爆炸效果
    function createFireworkBurst(baseX, baseY, baseZ, colorHue, count = 45) {
      const particles = [];
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      
      const mainColor = new THREE.Color(`hsl(${colorHue}, 90%, 65%)`);
      const secondaryColor = new THREE.Color(`hsl(${colorHue}, 85%, 80%)`);
      
      for (let i = 0; i < count; i++) {
        // 球形随机方向
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.asin((Math.random() * 2) - 1);
        const speed = 0.6 + Math.random() * 0.9;
        const vx = Math.cos(theta) * Math.cos(phi) * speed;
        const vy = Math.sin(phi) * speed + 0.25;
        const vz = Math.sin(theta) * Math.cos(phi) * speed;
        
        // 初始位置
        positions[i * 3] = baseX;
        positions[i * 3 + 1] = baseY;
        positions[i * 3 + 2] = baseZ;
        
        // 颜色渐变
        const mixedColor = mainColor.clone().lerp(secondaryColor, Math.random());
        colors[i * 3] = mixedColor.r;
        colors[i * 3 + 1] = mixedColor.g;
        colors[i * 3 + 2] = mixedColor.b;
        
        particles.push({
          velocity: new THREE.Vector3(vx, vy, vz),
          life: 1.0,
          decay: 0.008 + Math.random() * 0.018,
          basePosition: new THREE.Vector3(baseX, baseY, baseZ)
        });
      }
      
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      
      const material = new THREE.PointsMaterial({
        size: 0.08,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        transparent: true,
        opacity: 0.9
      });
      
      const points = new THREE.Points(geometry, material);
      fireworksGroup.add(points);
      
      return {
        points,
        particles,
        geometry
      };
    }
    
    // 生成环绕爱心的烟花位置 (心形外围)
    const fireworkInstances = [];
    const heartOutlinePositions = [];
    
    // 计算心形轮廓点用于烟花定位
    const steps = 22;
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      // 心形参数方程近似
      const angle = t * Math.PI * 2;
      const sx = 16 * Math.pow(Math.sin(angle), 3);
      const sy = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle);
      // 归一化并放大到合适尺寸
      const scaleFactor = 0.12;
      const px = sx * scaleFactor;
      const py = sy * scaleFactor * 0.9 + 0.25;
      heartOutlinePositions.push(new THREE.Vector3(px, py, 0));
    }
    
    // 在轮廓周围随机生成烟花基点
    for (let i = 0; i < 18; i++) {
      const basePoint = heartOutlinePositions[Math.floor(Math.random() * heartOutlinePositions.length)];
      // 添加随机偏移和深度
      const offsetX = (Math.random() - 0.5) * 0.5;
      const offsetY = (Math.random() - 0.5) * 0.35;
      const offsetZ = (Math.random() - 0.5) * 0.9;
      const baseX = basePoint.x + offsetX;
      const baseY = basePoint.y + offsetY;
      const baseZ = basePoint.z + offsetZ;
      
      const hue = Math.random() * 60 + 330; // 粉红到红色范围 (330-390 循环)
      const instance = createFireworkBurst(baseX, baseY, baseZ, hue % 360, 38 + Math.floor(Math.random() * 25));
      fireworkInstances.push(instance);
    }
    
    // 额外添加一些更外圈的烟花
    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.95 + Math.random() * 0.6;
      const baseX = Math.cos(angle) * radius * 0.9;
      const baseY = Math.sin(angle) * radius * 0.7 + 0.25;
      const baseZ = (Math.random() - 0.5) * 0.8;
      const hue = Math.random() * 40 + 340;
      const instance = createFireworkBurst(baseX, baseY, baseZ, hue % 360, 32);
      fireworkInstances.push(instance);
    }

    // --- 动画循环与烟花更新 ---
    let clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      // 使用固定时间因子让动画平滑
      const timeFactor = Math.min(delta * 30, 1.2);
      
      // 更新烟花粒子
      fireworkInstances.forEach((instance, index) => {
        const { points, particles, geometry } = instance;
        const positions = geometry.attributes.position.array;
        let allDead = true;
        
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (p.life <= 0) continue;
          
          allDead = false;
          // 更新位置
          positions[i * 3] += p.velocity.x * timeFactor * 0.9;
          positions[i * 3 + 1] += p.velocity.y * timeFactor * 0.9;
          positions[i * 3 + 2] += p.velocity.z * timeFactor * 0.9;
          
          // 添加轻微重力
          p.velocity.y -= 0.012 * timeFactor;
          
          // 减少生命
          p.life -= p.decay * timeFactor;
          
          // 根据生命值调整透明度 (通过粒子大小间接体现，或直接修改材质)
        }
        
        // 如果所有粒子死亡，重置烟花（重新生成在随机位置）
        if (allDead) {
          // 选择新的心形轮廓位置
          const basePoint = heartOutlinePositions[Math.floor(Math.random() * heartOutlinePositions.length)];
          const offsetX = (Math.random() - 0.5) * 0.55;
          const offsetY = (Math.random() - 0.5) * 0.4;
          const offsetZ = (Math.random() - 0.5) * 0.9;
          const newBaseX = basePoint.x + offsetX;
          const newBaseY = basePoint.y + offsetY;
          const newBaseZ = basePoint.z + offsetZ;
          
          const hue = Math.random() * 60 + 330;
          const mainColor = new THREE.Color(`hsl(${hue % 360}, 90%, 65%)`);
          const secondaryColor = new THREE.Color(`hsl(${hue % 360}, 85%, 80%)`);
          
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.asin((Math.random() * 2) - 1);
            const speed = 0.55 + Math.random() * 0.85;
            p.velocity.set(
              Math.cos(theta) * Math.cos(phi) * speed,
              Math.sin(phi) * speed + 0.2,
              Math.sin(theta) * Math.cos(phi) * speed
            );
            p.life = 1.0;
            p.decay = 0.008 + Math.random() * 0.02;
            p.basePosition.set(newBaseX, newBaseY, newBaseZ);
            
            positions[i * 3] = newBaseX;
            positions[i * 3 + 1] = newBaseY;
            positions[i * 3 + 2] = newBaseZ;
            
            const mixedColor = mainColor.clone().lerp(secondaryColor, Math.random());
            geometry.attributes.color.array[i * 3] = mixedColor.r;
            geometry.attributes.color.array[i * 3 + 1] = mixedColor.g;
            geometry.attributes.color.array[i * 3 + 2] = mixedColor.b;
          }
        }
        
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;
        
        // 动态调整透明度
        points.material.opacity = 0.7 + Math.sin(Date.now() * 0.01 + index) * 0.15;
      });
      
      // 让爱心和玫瑰轻微旋转/浮动
      heartGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.08 + 0.2;
      heartGroup.position.y = Math.sin(Date.now() * 0.002) * 0.03;
      
      // 相机轻微环绕
      // camera.position.x = 4.5 + Math.sin(Date.now() * 0.0005) * 0.4;
      // camera.lookAt(0, 0.5, 0);
      
      // 渲染主场景
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      
      requestAnimationFrame(animate);
    }

    animate();

    // --- 窗口大小自适应 ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 一些小提示 (控制台)
    console.log('💖 阿圆儿，520快乐！ 🌹 爱心、玫瑰与烟花为你绽放。');
    
  </script>

  <script>
    // 20条祝福词
    const wishes = [
      '天天开心',
      '万事如意',
      '心想事成',
      '幸福美满',
      '笑口常开',
      '好运连连',
      '甜蜜幸福',
      '平安喜乐',
      '美梦成真',
      '吉祥如意',
      '福星高照',
      '前程似锦',
      '一帆风顺',
      '岁岁平安',
      '健康快乐',
      '花开富贵',
      '快快乐乐',
      '喜气洋洋',
      '春风得意',
      '心花怒放'
    ];

    // 创建浮动祝福词
    function createFloatingWish() {
      const wishDiv = document.createElement('div');
      wishDiv.className = 'floating-wish';
      wishDiv.textContent = wishes[Math.floor(Math.random() * wishes.length)];
      
      // 全屏范围随机位置（左右方向）
      const leftPos = Math.random() * window.innerWidth;
      wishDiv.style.left = leftPos + 'px';
      
      // 随机选择向上或向下浮动
      const isUp = Math.random() > 0.5;
      if (isUp) {
        // 从底部向上浮动
        wishDiv.style.top = window.innerHeight + 'px';
        wishDiv.classList.add('float-up');
      } else {
        // 从顶部向下浮动
        wishDiv.style.top = '-50px';
        wishDiv.classList.add('float-down');
      }
      
      // 动画时长
      const duration = 3 + Math.random() * 2;
      wishDiv.style.animationDuration = duration + 's';
      
      // 随机旋转角度
      const rotate = (Math.random() - 0.5) * 10;
      wishDiv.style.transform = `rotate(${rotate}deg)`;
      
      // 添加随机颜色渐变
      const hues = ['#ff6b9d', '#ffc0cb', '#ff8fab', '#ffb3c6', '#ff758f', '#ff99ac'];
      const hue1 = hues[Math.floor(Math.random() * hues.length)];
      const hue2 = hues[Math.floor(Math.random() * hues.length)];
      wishDiv.style.background = `linear-gradient(135deg, ${hue1}, ${hue2}, ${hue1})`;
      wishDiv.style.backgroundClip = 'text';
      wishDiv.style.webkitBackgroundClip = 'text';
      
      document.body.appendChild(wishDiv);
      
      // 动画结束后移除元素
      setTimeout(() => {
        wishDiv.remove();
      }, (duration + 0.3) * 1000);
    }

    // 持续生成祝福词
    setInterval(createFloatingWish, 300);
    
    // 立即生成一批祝福词（打开页面就有，无延迟）
    for (let i = 0; i < 15; i++) {
      createFloatingWish();
    }
  </script>
</body>
</html>
